<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>남극 대탈출</title>
<style>
html,body{margin:0;height:100%;background:#0b1530;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
const rand = (a, b) => a + Math.random() * (b - a);
let W, H, S, GY, px;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, innerWidth || 800) * dpr; cv.height = Math.max(1, innerHeight || 450) * dpr;
  S = Math.min(cv.height / 450, cv.width / 720);
  W = cv.width / S; H = cv.height / S;
  GY = H - 90; px = Math.max(W * 0.42, 300);
}
addEventListener('resize', resize); resize();

// ---------- 사운드 ----------
let ac = null, muted = false;
function beep(f1, f2, dur, type = 'square', vol = 0.06) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(f2, n + dur);
    g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.001, n + dur);
    o.connect(g).connect(ac.destination); o.start(n); o.stop(n + dur);
  } catch (e) {}
}
const sfx = {
  jump: () => beep(420, 820, 0.15, 'square', 0.04),
  hit: () => beep(240, 70, 0.3, 'sawtooth', 0.08),
  fish: () => { beep(660, 1320, 0.12, 'triangle', 0.07); setTimeout(() => beep(990, 1760, 0.12, 'triangle', 0.06), 80); },
  roar: () => { beep(190, 55, 0.9, 'sawtooth', 0.09); beep(140, 45, 1.0, 'square', 0.05); },
};

// ---------- 상태 ----------
let best = 0;
try { best = +localStorage.getItem('antarctic_best') || 0; } catch (e) {}
const MAXGAP = 240;
let state = 'title', p, obs, items, parts, pops, speed, dist, gap, t, shake, spawnT, itemT, roarT, roarA, flash, overT, bgX = 0, clock = 0, downHeld = false, newBest = false;

function reset() {
  p = { y: 0, vy: 0, ground: true, jumps: 0, slide: 0, inv: 0, anim: 0 };
  obs = []; items = []; parts = []; pops = [];
  speed = 320; dist = 0; gap = 190; t = 0; shake = 0; spawnT = 1.4; itemT = 3; roarT = 3; roarA = 0; flash = 0; overT = 0; newBest = false;
}
reset();

const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.55, r: rand(0.3, 1.7), ph: rand(0, 6) }));
const snow = Array.from({ length: 130 }, () => ({ x: rand(0, 2000), y: rand(0, 900), r: rand(0.8, 2.6), v: rand(30, 90) }));

// ---------- 입력 ----------
function start() {
  if (state === 'play') return;
  if (state === 'over' && overT < 0.9) return;
  reset(); state = 'play';
}
function jump() {
  if (state !== 'play') return start();
  if (p.ground) { p.vy = 820; p.ground = false; p.jumps = 1; p.slide = 0; sfx.jump(); puff(px, GY, 6); }
  else if (p.jumps < 2) { p.vy = 700; p.jumps = 2; sfx.jump(); puff(px, GY - p.y, 5); }
}
function slide() {
  if (state !== 'play') return;
  if (p.ground) p.slide = Math.max(p.slide, 0.55);
  else { p.vy = -950; p.slide = 0.55; }
}
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'KeyW'].includes(k)) { e.preventDefault(); if (!e.repeat) jump(); }
  else if (['ArrowDown', 'KeyS'].includes(k)) { e.preventDefault(); downHeld = true; if (!e.repeat) slide(); }
  else if (k === 'Enter') start();
  else if (k === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { if (['ArrowDown', 'KeyS'].includes(e.code)) downHeld = false; });
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state !== 'play') return start();
  if (e.clientX < innerWidth * 0.4) { downHeld = true; slide(); } else jump();
});
addEventListener('pointerup', () => downHeld = false);
addEventListener('pointercancel', () => downHeld = false);

// ---------- 효과 ----------
function puff(x, y, n, col = '#ffffff') {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-120, 60), vy: rand(-140, -20), life: rand(0.3, 0.7), r: rand(2, 5), col });
}
function pop(x, y, txt, col) { pops.push({ x, y, txt, col, life: 1.2 }); }

// ---------- 스폰 ----------
function spawnObstacle() {
  const opts = ['mound', 'block', 'penguin'];
  if (t > 6) opts.push('crack', 'crack');
  if (t > 10) opts.push('icicle', 'icicle');
  const type = opts[Math.floor(Math.random() * opts.length)];
  const o = { type, x: W + 40, hit: false };
  if (type === 'mound') { o.w = rand(55, 85); o.h = rand(24, 34); }
  if (type === 'block') { o.w = 40; o.h = rand(42, 56); }
  if (type === 'penguin') { o.w = 28; o.h = 36; o.ph = rand(0, 6); }
  if (type === 'crack') { o.w = rand(60, 80); o.h = 0; }
  if (type === 'icicle') { o.w = rand(70, 100); o.h = 0; }
  obs.push(o);
}

function playerRect() {
  const h = p.slide > 0 && p.ground ? 28 : 60;
  return { x1: px - 12, x2: px + 12, y1: GY - p.y - h, y2: GY - p.y };
}
function obsRect(o) {
  if (o.type === 'icicle') return { x1: o.x + 6, x2: o.x + o.w - 6, y1: -9999, y2: GY - 42 };
  return { x1: o.x + 6, x2: o.x + o.w - 6, y1: GY - o.h + 6, y2: GY };
}
const overlap = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;

function hurt() {
  if (p.inv > 0) return;
  gap -= 70; p.inv = 1.1; shake = 14; flash = 0.35;
  sfx.hit(); puff(px, GY - p.y - 30, 16, '#dff3ff');
  pop(px, GY - 120, '꽈당! 공룡이 다가온다!', '#ff6b6b');
}

// ---------- 업데이트 ----------
function update(dt) {
  clock += dt;
  for (const s of snow) {
    s.y += s.v * dt; s.x -= (s.v * 0.4 + (state === 'play' ? speed * 0.15 : 30)) * dt;
    if (s.y > H) { s.y = -5; s.x = rand(0, W + 200); }
    if (s.x < -10) s.x += W + 20;
  }
  parts = parts.filter(q => (q.life -= dt) > 0);
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt; }
  pops = pops.filter(q => (q.life -= dt) > 0);
  for (const q of pops) q.y -= 30 * dt;
  shake = Math.max(0, shake - 40 * dt);
  flash = Math.max(0, flash - dt);
  roarA = Math.max(0, roarA - dt);

  if (state === 'title') { bgX += 160 * dt; p.anim += dt * 8; return; }
  if (state === 'over') {
    overT += dt; speed = Math.max(0, speed - 900 * dt); bgX += speed * dt;
    gap = Math.max(-45, gap - 260 * dt);
    for (const o of obs) o.x -= speed * dt;
    return;
  }

  t += dt;
  speed = Math.min(780, 320 + t * 8);
  dist += speed * dt / 30;
  bgX += speed * dt;

  // 플레이어
  if (!p.ground) {
    p.vy -= 2300 * dt; p.y += p.vy * dt;
    if (p.y <= 0) { p.y = 0; p.vy = 0; p.ground = true; p.jumps = 0; puff(px, GY, 6); }
  }
  if (p.slide > 0) p.slide -= dt;
  if (downHeld && p.ground) p.slide = Math.max(p.slide, 0.1);
  p.inv -= dt;
  p.anim += dt * speed / 38;

  // 공룡 추격: 시간이 지날수록 공룡이 빨라진다
  gap += (14 - t * 0.11) * dt;
  gap = Math.min(MAXGAP, gap);

  roarT -= dt;
  if (roarT <= 0) { roarT = rand(5, 9); roarA = 1; shake = 10; sfx.roar(); pop(px - gap - 40, GY - 190, '크아아앙!!', '#ffd166'); }

  // 장애물
  spawnT -= dt;
  if (spawnT <= 0) { spawnObstacle(); spawnT = Math.max(0.75, rand(1.0, 1.9) - t / 150); }
  itemT -= dt;
  if (itemT <= 0) { items.push({ x: W + 40, y: GY - rand(75, 150), got: false }); itemT = rand(3, 6); }

  const pr = playerRect();
  for (const o of obs) {
    o.x -= (speed + (o.type === 'penguin' ? 70 : 0)) * dt;
    if (o.hit) continue;
    if (o.type === 'crack') {
      if (p.y < 1 && px > o.x + 12 && px < o.x + o.w - 12) { o.hit = true; hurt(); }
    } else if (overlap(pr, obsRect(o))) { o.hit = true; hurt(); }
  }
  obs = obs.filter(o => o.x + o.w > -320);

  for (const f of items) {
    f.x -= speed * dt;
    if (!f.got && overlap(pr, { x1: f.x - 16, x2: f.x + 16, y1: f.y - 12, y2: f.y + 12 })) {
      f.got = true; gap = Math.min(MAXGAP, gap + 45); sfx.fish();
      puff(f.x, f.y, 12, '#ffd166'); pop(f.x, f.y - 20, '🐟 냠! 거리 +', '#7CFFB2');
    }
  }
  items = items.filter(f => !f.got && f.x > -40);

  if (gap <= 0) {
    state = 'over'; overT = 0; shake = 20; sfx.roar();
    const d = Math.floor(dist);
    if (d > best) { best = d; newBest = true; try { localStorage.setItem('antarctic_best', best); } catch (e) {} }
  }
}

// ---------- 그리기 ----------
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, '#050d26'); g.addColorStop(0.55, '#16306a'); g.addColorStop(1, '#5d8ac2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY);
  for (const s of stars) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(clock * 1.5 + s.ph));
    circ(s.x * W, s.y * GY, s.r, '#fff');
  }
  ctx.globalAlpha = 1;
  // 오로라
  const cols = [['rgba(90,255,170,', 0], ['rgba(120,200,255,', 1.7], ['rgba(190,120,255,', 3.1]];
  for (const [c, o] of cols) {
    const base = 70 + o * 18;
    ctx.beginPath();
    for (let x = 0; x <= W + 20; x += 20) {
      const y = base + Math.sin(x * 0.005 + clock * 0.35 + o) * 28 + Math.sin(x * 0.013 - clock * 0.5) * 10;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let x = W + 20; x >= 0; x -= 20) {
      const y = base + 90 + Math.sin(x * 0.005 + clock * 0.35 + o) * 28;
      ctx.lineTo(x, y);
    }
    const ag = ctx.createLinearGradient(0, base - 30, 0, base + 110);
    ag.addColorStop(0, c + '0)'); ag.addColorStop(0.3, c + '0.28)'); ag.addColorStop(1, c + '0)');
    ctx.fillStyle = ag; ctx.fill();
  }
  // 먼 산
  layer(bgX * 0.08, GY - 40, 130, '#6d88b8', 0.004, 0.011, 1);
  layer(bgX * 0.08, GY - 40, 130, 'rgba(255,255,255,0.0)', 0, 0, 1);
  // 빙산
  layer(bgX * 0.25, GY - 10, 75, '#b9cfea', 0.009, 0.023, 3);
  layer(bgX * 0.5, GY, 35, '#dbe8f7', 0.015, 0.04, 5);
}
function layer(off, base, amp, col, f1, f2, seed) {
  if (!f1) return;
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GY + 2);
  for (let x = 0; x <= W + 16; x += 16) {
    const X = x + off;
    const h = amp * (0.55 + 0.3 * Math.sin(X * f1 + seed) + 0.15 * Math.abs(Math.sin(X * f2 + seed * 2)));
    ctx.lineTo(x, base - h);
  }
  ctx.lineTo(W + 16, GY + 2); ctx.closePath(); ctx.fill();
}

function drawGround() {
  const g = ctx.createLinearGradient(0, GY, 0, H);
  g.addColorStop(0, '#f4faff'); g.addColorStop(1, '#bcd6f0');
  ctx.fillStyle = g; ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = '#d3e6f8'; ctx.fillRect(0, GY, W, 4);
  ctx.strokeStyle = 'rgba(110,150,205,0.35)'; ctx.lineWidth = 2;
  const span = W + 200;
  for (let i = 0; i < 24; i++) {
    const x = ((i * 157 - bgX) % span + span) % span - 100, y = GY + 14 + (i * 37) % (H - GY - 24);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 18 + (i % 3) * 10, y); ctx.stroke();
  }
}

function drawObstacle(o) {
  const x = o.x, w = o.w;
  if (o.type === 'mound') {
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x + w / 2, GY, w / 2, o.h, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#cfe2f6'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 6, GY, w / 2 - 8, o.h * 0.55, 0, Math.PI, 0); ctx.fill();
  } else if (o.type === 'block') {
    const y = GY - o.h;
    ctx.fillStyle = '#9fdcff'; rr(x, y, w, o.h, 5); ctx.fill();
    ctx.strokeStyle = '#5fb0e0'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x + 6, y + 6, 6, o.h - 16); ctx.fillRect(x + 6, y + 6, w - 16, 5);
  } else if (o.type === 'penguin') {
    const cx = x + w / 2;
    ctx.save(); ctx.translate(cx, GY); ctx.rotate(Math.sin(clock * 14 + o.ph) * 0.15);
    ctx.fillStyle = '#ff9f1c'; ctx.fillRect(-9, -3, 7, 3); ctx.fillRect(2, -3, 7, 3);
    ctx.fillStyle = '#1d2433'; ctx.beginPath(); ctx.ellipse(0, -18, 13, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-3, -15, 8, 13, 0, 0, Math.PI * 2); ctx.fill();
    circ(-6, -27, 2.2, '#fff'); circ(-6.5, -27, 1.1, '#000');
    ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(-10, -25); ctx.lineTo(-18, -23); ctx.lineTo(-10, -21); ctx.fill();
    ctx.restore();
  } else if (o.type === 'crack') {
    const g = ctx.createLinearGradient(0, GY, 0, H);
    g.addColorStop(0, '#2a5c8a'); g.addColorStop(1, '#06162b');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, GY);
    for (let i = 1; i <= 5; i++) ctx.lineTo(x + (w / 2) * (i / 5) * 0.4 + (i % 2) * 6, GY + (H - GY) * i / 5);
    ctx.lineTo(x + w - 10, H);
    for (let i = 5; i >= 1; i--) ctx.lineTo(x + w - (w / 2) * (i / 5) * 0.4 - (i % 2) * 6, GY + (H - GY) * (i - 1) / 5);
    ctx.lineTo(x + w, GY); ctx.closePath(); ctx.fill();
  } else if (o.type === 'icicle') {
    const bot = GY - 66;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#8fd0f5'); g.addColorStop(0.5, '#d8f1ff'); g.addColorStop(1, '#8fd0f5');
    ctx.fillStyle = g; ctx.fillRect(x, -10, w, bot + 10);
    ctx.fillStyle = '#c4e8fb';
    const n = Math.floor(w / 14);
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const ix = x + i * (w / n); ctx.moveTo(ix, bot); ctx.lineTo(ix + w / n / 2, bot + 18 + (i % 2) * 6); ctx.lineTo(ix + w / n, bot); }
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(x + 8, 0, 5, bot - 10);
    // 경고 표시
    ctx.fillStyle = '#ffd166'; ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('▼ 숙여!', x + w / 2, bot - 10);
  }
}

function drawFish(f) {
  const y = f.y + Math.sin(clock * 5 + f.x * 0.02) * 5;
  ctx.save(); ctx.translate(f.x, y);
  ctx.fillStyle = 'rgba(255,220,120,0.25)'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4ea8de'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(20, -8); ctx.lineTo(20, 8); ctx.fill();
  ctx.fillStyle = '#bde0fe'; ctx.beginPath(); ctx.ellipse(-2, 3, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
  circ(-8, -2, 1.8, '#111');
  ctx.restore();
}

function drawPlayer() {
  if (state === 'over' && gap < -15) return; // 꿀꺽...
  const y = GY - p.y;
  ctx.fillStyle = 'rgba(40,70,120,0.25)'; ctx.beginPath(); ctx.ellipse(px, GY + 2, 16 - Math.min(p.y, 100) / 12, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(px, y);
  if (p.inv > 0 && Math.floor(p.inv * 14) % 2) ctx.globalAlpha = 0.35;
  const sl = state === 'play' && p.slide > 0 && p.ground;
  if (sl) { ctx.translate(-6, -2); ctx.rotate(-1.2); }
  if (state === 'over') ctx.translate(Math.sin(clock * 60) * 2, 0);
  const run = p.ground && !sl;
  const a = Math.sin(p.anim) * (run ? 0.8 : 0.25);
  const leg = (ang, col) => {
    ctx.save(); ctx.translate(0, -22); ctx.rotate(ang);
    ctx.fillStyle = col; ctx.fillRect(-4, 0, 8, 18);
    ctx.fillStyle = '#1b1b1b'; rr(-4, 16, 13, 6, 2); ctx.fill();
    ctx.restore();
  };
  leg(-a, '#1f2b44');
  // 배낭
  ctx.fillStyle = '#f4a261'; rr(-20, -47, 9, 24, 3); ctx.fill();
  // 몸통
  ctx.fillStyle = '#e63946'; rr(-13, -50, 26, 32, 8); ctx.fill();
  ctx.strokeStyle = '#9d0208'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(3, -48); ctx.lineTo(3, -20); ctx.stroke();
  leg(a, '#2b3a55');
  // 팔
  ctx.save(); ctx.translate(0, -44); ctx.rotate(run ? a * 0.9 : -2.4);
  ctx.fillStyle = '#c1121f'; ctx.fillRect(-3, 0, 7, 17); circ(0.5, 18, 4, '#264653');
  ctx.restore();
  // 머리
  circ(2, -59, 13, '#e63946');
  ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(5, -58, 8.5, 0, Math.PI * 2); ctx.stroke();
  circ(5, -58, 7, '#f6c9a0');
  circ(8, -60, 1.5, '#222');
  circ(10, -54.5, 1.6, '#7a2e2e');
  if (gap < 90 || state === 'over') { // 식은땀
    ctx.fillStyle = '#8ecae6'; ctx.beginPath(); ctx.ellipse(-4, -66 + (clock * 20 % 8), 1.8, 3, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawDino(x, run, mouth) {
  ctx.save(); ctx.translate(x, GY);
  const c1 = '#4f9a4a', c2 = '#356b33', belly = '#b9d98a';
  const bob = Math.abs(Math.sin(run)) * -5;
  const wag = Math.sin(run * 0.5) * 8;
  const legDraw = (ph, col) => {
    const hx = -125, hy = -80 + bob;
    const fx = hx + Math.sin(ph) * 38, fy = -Math.max(0, Math.cos(ph)) * 20;
    const kx = (hx + fx) / 2 + 14, ky = (hy + fy) / 2;
    ctx.strokeStyle = col; ctx.lineCap = 'round';
    ctx.lineWidth = 24; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.stroke();
    ctx.lineWidth = 13; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy - 4); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(fx + 8, fy - 3, 15, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#eee';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(fx + 14 + i * 4, fy - 6); ctx.lineTo(fx + 21 + i * 4, fy); ctx.lineTo(fx + 13 + i * 4, fy); ctx.fill(); }
  };
  legDraw(run + Math.PI, c2);
  // 꼬리
  ctx.fillStyle = c1; ctx.beginPath();
  ctx.moveTo(-160, -120 + bob); ctx.quadraticCurveTo(-235, -115 + bob + wag * 0.5, -300, -88 + wag);
  ctx.quadraticCurveTo(-230, -82 + bob, -150, -72 + bob); ctx.fill();
  // 등 가시
  ctx.fillStyle = c2;
  for (let i = 0; i < 7; i++) {
    const sx = -200 + i * 18, sy = -116 - Math.sin(i / 6 * Math.PI) * 22 + bob;
    ctx.beginPath(); ctx.moveTo(sx - 7, sy + 8); ctx.lineTo(sx + 2, sy - 12); ctx.lineTo(sx + 9, sy + 8); ctx.fill();
  }
  // 몸통
  ctx.fillStyle = c1; ctx.beginPath(); ctx.ellipse(-125, -102 + bob, 64, 40, -0.18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(-108, -84 + bob, 44, 17, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = c2; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-160 + i * 22, -130 + bob); ctx.lineTo(-150 + i * 22, -112 + bob); ctx.stroke(); }
  // 목
  ctx.fillStyle = c1; ctx.beginPath();
  ctx.moveTo(-110, -132 + bob); ctx.quadraticCurveTo(-75, -158 + bob, -55, -140 + bob);
  ctx.lineTo(-62, -105 + bob); ctx.lineTo(-100, -92 + bob); ctx.fill();
  // 짧은 팔
  ctx.strokeStyle = c2; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-72, -100 + bob); ctx.lineTo(-56, -92 + bob + Math.sin(run * 2) * 4); ctx.stroke();
  legDraw(run, c1);
  // 머리
  ctx.translate(-68, -150 + bob);
  const r = 0.15 + mouth * 0.55;
  const jx = 5 + 56 * Math.cos(r), jy = 4 + 56 * Math.sin(r);
  ctx.fillStyle = '#7a1020'; ctx.beginPath(); ctx.moveTo(5, -2); ctx.lineTo(64, -2); ctx.lineTo(jx, jy); ctx.lineTo(5, 10); ctx.fill();
  ctx.save(); ctx.translate(5, 4); ctx.rotate(r);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(12 + i * 7, 0); ctx.lineTo(15 + i * 7, -7); ctx.lineTo(18 + i * 7, 0); ctx.fill(); }
  ctx.fillStyle = c1; ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(56, 0); ctx.lineTo(53, 10); ctx.quadraticCurveTo(22, 17, 0, 12); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(14 + i * 7, -1); ctx.lineTo(17 + i * 7, 8); ctx.lineTo(20 + i * 7, -1); ctx.fill(); }
  ctx.fillStyle = c1; ctx.beginPath();
  ctx.moveTo(-8, 8); ctx.quadraticCurveTo(-10, -26, 22, -28); ctx.quadraticCurveTo(52, -26, 66, -12);
  ctx.lineTo(68, 0); ctx.lineTo(2, 2); ctx.closePath(); ctx.fill();
  circ(26, -14, 6, '#fff9c4'); circ(28, -14, 3, '#c1121f'); circ(28.5, -14, 1.3, '#000');
  ctx.strokeStyle = c2; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(17, -24); ctx.lineTo(35, -18); ctx.stroke();
  circ(60, -12, 2, c2);
  ctx.restore();
}

function drawHUD() {
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = `bold 26px ${FONT}`;
  ctx.fillText(`${Math.floor(dist)} m`, 20, 40);
  ctx.font = `14px ${FONT}`; ctx.fillStyle = '#cfe3ff';
  ctx.fillText(`최고 기록 ${best} m`, 20, 62);
  // 거리 게이지
  const bw = Math.min(260, W * 0.36), bx = W / 2 - bw / 2, by = 22, ratio = Math.max(0, gap) / MAXGAP;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(bx, by, bw, 14, 7); ctx.fill();
  ctx.fillStyle = ratio > 0.5 ? '#5be37d' : ratio > 0.25 ? '#ffc93c' : '#ff4d4d';
  rr(bx, by, Math.max(14, bw * ratio), 14, 7); ctx.fill();
  ctx.font = `20px ${FONT}`; ctx.textAlign = 'right'; ctx.fillText('🦖', bx - 6, by + 15);
  ctx.textAlign = 'left'; ctx.fillText('🏃', bx + bw + 6, by + 15);
  ctx.textAlign = 'center'; ctx.font = `12px ${FONT}`; ctx.fillStyle = '#fff';
  ctx.fillText('공룡과의 거리', W / 2, by + 32);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(muted ? 'M: 소리 켜기' : 'M: 소리 끄기', W - 16, 30);
  if (t < 5 && 'ontouchstart' in window) {
    ctx.globalAlpha = 1 - t / 5; ctx.font = `bold 15px ${FONT}`; ctx.fillStyle = '#1d3557';
    ctx.textAlign = 'left'; ctx.fillText('◀ 왼쪽 탭: 슬라이드', 16, H - 24);
    ctx.textAlign = 'right'; ctx.fillText('오른쪽 탭: 점프 ▶', W - 16, H - 24);
    ctx.globalAlpha = 1;
  }
}

function panel(lines) {
  const w = Math.min(560, W - 40), h = 60 + lines.length * 34, x = W / 2 - w / 2, y = Math.max(20, GY / 2 - h / 2 - 20);
  ctx.fillStyle = 'rgba(5,15,40,0.72)'; rr(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(160,210,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'center';
  let yy = y + 50;
  for (const [txt, size, col, bold] of lines) {
    ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.fillStyle = col;
    ctx.fillText(txt, W / 2, yy); yy += size > 30 ? 46 : 30;
  }
}

function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBackground(); drawGround();
  for (const o of obs) if (o.type === 'crack') drawObstacle(o);
  for (const f of items) drawFish(f);
  for (const o of obs) if (o.type !== 'crack') drawObstacle(o);
  drawPlayer();
  const dinoRun = state === 'title' ? clock * 9 : (state === 'over' ? clock * 9 * speed / 320 : p.anim * 0.95);
  const mouth = state === 'over' ? 0.6 + Math.sin(clock * 18) * 0.4 : Math.min(1, 0.15 + Math.abs(Math.sin(clock * 3)) * 0.2 + roarA);
  const dinoGap = state === 'title' ? 170 + Math.sin(clock) * 20 : gap;
  drawDino(px - 6 - dinoGap, dinoRun, mouth);
  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.life * 2); circ(q.x, q.y, q.r, q.col); }
  ctx.globalAlpha = 1;
  for (const s of snow) circ(s.x, s.y, s.r, 'rgba(255,255,255,0.85)');
  ctx.font = `bold 18px ${FONT}`; ctx.textAlign = 'center';
  for (const q of pops) {
    ctx.globalAlpha = Math.min(1, q.life * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 4; ctx.strokeText(q.txt, q.x, q.y);
    ctx.fillStyle = q.col; ctx.fillText(q.txt, q.x, q.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 위험 효과
  const danger = state === 'play' ? Math.max(0, 1 - gap / 80) : 0;
  if (danger > 0 || flash > 0) {
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75);
    const al = Math.max(danger * (0.35 + 0.25 * Math.sin(clock * 10)), flash);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, `rgba(255,30,30,${al})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  if (state === 'play') drawHUD();
  if (state === 'title') {
    panel([
      ['🦖 남극 대탈출 🐧', 38, '#ffffff', true],
      ['남극 기지에 공룡이 나타났다! 최대한 멀리 도망쳐라!', 16, '#cfe3ff'],
      ['점프: Space / ↑  (공중에서 한 번 더 = 2단 점프)', 15, '#ffffff'],
      ['슬라이드: ↓  — 고드름 밑은 숙여서 통과!', 15, '#ffffff'],
      ['🐟 생선을 먹으면 공룡과 거리가 벌어져요', 15, '#7CFFB2'],
      ['모바일: 화면 왼쪽 탭 = 슬라이드, 오른쪽 탭 = 점프', 13, '#9fb8d8'],
      [Math.sin(clock * 4) > -0.3 ? '▶ Space 또는 화면을 탭해서 시작' : '', 18, '#ffd166', true],
    ]);
  }
  if (state === 'over' && overT > 0.6) {
    panel([
      ['꿀꺽! 공룡에게 잡혔다 🦖', 34, '#ff8a8a', true],
      [`도망친 거리: ${Math.floor(dist)} m`, 22, '#ffffff', true],
      [newBest ? `🎉 신기록! 🎉` : `최고 기록: ${best} m`, 18, newBest ? '#ffd166' : '#cfe3ff'],
      [overT > 0.9 && Math.sin(clock * 4) > -0.3 ? '▶ Space 또는 탭으로 다시 도전' : '', 18, '#ffd166', true],
    ]);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
